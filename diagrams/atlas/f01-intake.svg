<g class="node"><rect x="1100" y="995" width="365" height="160" rx="15" fill="#FCE9E3" stroke="#EAB8A8" stroke-width="2"/><rect x="1102" y="1015" width="6" height="120" rx="3" fill="#F0AE99"/><text x="1124" y="1038" font-size="18" font-weight="700" fill="#1A1C1D">ИИ GPUGO</text><text x="1124" y="1080" font-size="15" fill="#34444E">Анализ по правилам</text><text x="1124" y="1105" font-size="15" fill="#34444E">Только доступный контекст</text></g>
