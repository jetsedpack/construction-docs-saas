<text class="nb" x="857" y="608">словари остаются локально</text>
<rect x="1210" y="510" width="330" height="165" rx="14" fill="#FCE9E0" stroke="#E5BAA5" stroke-width="2" filter="url(#shadow)"/>
<rect x="1210" y="525" width="6" height="135" rx="3" fill="#F0AE99"/>
