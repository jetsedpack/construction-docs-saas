<g class="node"><path d="M 116 285 H 444 L 465 306 V 431 Q 465 445 451 445 H 114 Q 100 445 100 431 V 301 Q 100 285 116 285 Z" fill="#E3F4FA" stroke="#AED4E1" stroke-width="2"/><path d="M 444 285 V 306 H 465" fill="none" stroke="#AED4E1" stroke-width="2"/><rect x="102" y="305" width="6" height="120" rx="3" fill="#67D6EF"/><text x="124" y="328" font-size="18" font-weight="700" fill="#1A1C1D">ВСЯ ПАПКА РАЗОМ</text><text x="124" y="370" font-size="15" fill="#34444E">Файлы с вложенными папками</text><text x="124" y="395" font-size="15" fill="#34444E">Ничего вручную не сортируем</text></g>
<g class="node"><rect x="600" y="285" width="365" height="160" rx="15" fill="#EDE8F5" stroke="#C6B8D9" stroke-width="2"/><path d="M 602 312 Q 782.5 332 963 312" fill="none" stroke="#C6B8D9" stroke-width="1.8" opacity=".6"/><rect x="602" y="305" width="6" height="120" rx="3" fill="#C5B7E7"/><text x="624" y="328" font-size="18" font-weight="700" fill="#1A1C1D">ЗАКРЫТЫЙ АРХИВ</text><text x="624" y="370" font-size="15" fill="#34444E">Оригиналы и хеши</text><text x="624" y="395" font-size="15" fill="#34444E">Версии и статусы импорта</text></g>
<g class="node"><rect x="1100" y="285" width="365" height="160" rx="15" fill="#E4F5E8" stroke="#A8D2B0" stroke-width="2"/><rect x="1102" y="305" width="6" height="120" rx="3" fill="#87E481"/><text x="1124" y="328" font-size="18" font-weight="700" fill="#1A1C1D">ТИП КАЖДОГО ФАЙЛА</text><text x="1124" y="370" font-size="15" fill="#34444E">Свой выпадающий список</text><text x="1124" y="395" font-size="15" fill="#34444E">Инженер делает выбор</text></g>
