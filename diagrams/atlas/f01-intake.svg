<text class="nb" x="480" y="827">Нет типа / OCR / риск утечки</text>
<rect x="836" y="755" width="330" height="110" rx="14" fill="#FAF0D4" stroke="#D9BC7D" stroke-width="2" filter="url(#shadow)"/>
<rect x="836" y="770" width="6" height="80" rx="3" fill="#E7C66B"/>
