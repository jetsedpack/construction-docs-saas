<text class="nb" x="857" y="827">Покрытие, политика, метаданные</text>
<rect x="1210" y="755" width="330" height="110" rx="14" fill="#E3F5E6" stroke="#AFD4B6" stroke-width="2" filter="url(#shadow)"/>
<rect x="1210" y="770" width="6" height="80" rx="3" fill="#87E481"/>
<text class="nt" x="1231" y="793">09 · НА GPUGO</text>
<text class="nb" x="1231" y="827">Только валидированный JSON</text>
<text x="951" y="451" font-size="13" font-family="Arial,sans-serif" fill="#6B7478">выбранный тип</text>
<text x="1383" y="704" font-size="13" font-family="Arial,sans-serif" fill="#6B7478">анализ безопасности</text>
<text x="844" y="796" font-size="13" font-family="Arial,sans-serif" fill="#6B7478">нет</text>
<text x="1174" y="796" font-size="13" font-family="Arial,sans-serif" fill="#6B7478">да</text>
<text x="84" y="960" font-family="Arial,sans-serif" font-size="16" fill="#6B7478">Важно: тип выбирает инженер. Выбранный тип управляет парсером, но не даёт права автоматически отправлять содержание.</text>
<path d="M65 942 H1735" stroke="#DBDFDE" stroke-width="1.4"/>
<text x="65" y="977" font-family="Arial,sans-serif" font-size="13" fill="#6B7478">СОГЛАСОВАНО: массовая загрузка + ручной выбор типа каждого файла  ·  РЕАЛИЗАЦИЯ: будущая</text>
