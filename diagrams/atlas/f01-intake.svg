<g class="node"><rect x="1600" y="650" width="365" height="170" rx="15" fill="#E3F4FA" stroke="#AED4E1" stroke-width="2"/><rect x="1602" y="670" width="6" height="130" rx="3" fill="#67D6EF"/><text x="1624" y="693" font-size="18" font-weight="700" fill="#1A1C1D">ПОЛЯ И МЕТАДАННЫЕ</text><text x="1624" y="735" font-size="15" fill="#34444E">Позиции, координаты, редакции</text><text x="1624" y="760" font-size="15" fill="#34444E">Все связи и пропуски</text></g>
<g class="node"><rect x="1100" y="650" width="365" height="170" rx="15" fill="#EDE8F5" stroke="#C6B8D9" stroke-width="2"/><path d="M 1102 677 Q 1282.5 697 1463 677" fill="none" stroke="#C6B8D9" stroke-width="1.8" opacity=".6"/><rect x="1102" y="670" width="6" height="130" rx="3" fill="#C5B7E7"/><text x="1124" y="693" font-size="18" font-weight="700" fill="#1A1C1D">ОБЕЗЛИЧИВАНИЕ</text><text x="1124" y="735" font-size="15" fill="#34444E">Сквозные псевдонимы</text><text x="1124" y="760" font-size="15" fill="#34444E">Словарь только в Windows</text></g>
<g class="node"><rect x="600" y="650" width="365" height="170" rx="15" fill="#E4F5E8" stroke="#A8D2B0" stroke-width="2"/><rect x="602" y="670" width="6" height="130" rx="3" fill="#87E481"/><text x="624" y="693" font-size="18" font-weight="700" fill="#1A1C1D">СТРУКТУРНАЯ КОПИЯ</text><text x="624" y="735" font-size="15" fill="#34444E">Все поля, связи, расположение</text><text x="624" y="760" font-size="15" fill="#34444E">Безопасные метаданные</text></g>
<g class="node"><path d="M 115 650 H 450 L 465 665 V 805 L 450 820 H 115 L 100 805 V 665 Z" fill="#FBF2D8" stroke="#DEC58B" stroke-width="2"/><rect x="102" y="670" width="6" height="130" rx="3" fill="#E7C66B"/><text x="124" y="693" font-size="18" font-weight="700" fill="#1A1C1D">КОНТРОЛЬ ШЛЮЗА</text><text x="124" y="735" font-size="15" fill="#34444E">Проверка политики и охвата</text><text x="124" y="760" font-size="15" fill="#34444E">Неизвестное запрещаем</text></g>
