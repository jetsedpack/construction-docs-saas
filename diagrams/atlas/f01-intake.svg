<text class="nb" x="1231" y="608">разрешённые метаданные</text>
<rect x="459" y="755" width="330" height="110" rx="14" fill="#FCE9E0" stroke="#E5BAA5" stroke-width="2" filter="url(#shadow)"/>
<rect x="459" y="770" width="6" height="80" rx="3" fill="#F0AE99"/>
