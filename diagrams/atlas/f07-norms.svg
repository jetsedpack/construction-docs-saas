<text x="100" y="253" font-size="17" letter-spacing="1" font-weight="700" fill="#34444E">01  /  НОРМАТИВЫ И ПРАВИЛА ХРАНЯТСЯ В «КОРОБКЕ»</text>
<g class="node"><path d="M 116 300 H 444 L 465 321 V 446 Q 465 460 451 460 H 114 Q 100 460 100 446 V 316 Q 100 300 116 300 Z" fill="#FBF2D8" stroke="#DEC58B" stroke-width="2"/><path d="M 444 300 V 321 H 465" fill="none" stroke="#DEC58B" stroke-width="2"/><rect x="102" y="320" width="6" height="120" rx="3" fill="#E7C66B"/><text x="124" y="343" font-size="18" font-weight="700" fill="#1A1C1D">ИСТОЧНИКИ НОРМ</text><text x="124" y="385" font-size="15" fill="#34444E">Официальные публикации</text><text x="124" y="410" font-size="15" fill="#34444E">Действующие редакции</text></g>
<g class="node"><rect x="600" y="300" width="365" height="160" rx="15" fill="#FCE9E3" stroke="#EAB8A8" stroke-width="2"/><rect x="602" y="320" width="6" height="120" rx="3" fill="#F0AE99"/><text x="624" y="343" font-size="18" font-weight="700" fill="#1A1C1D">ИИ · МОНИТОРИНГ</text><text x="624" y="385" font-size="15" fill="#34444E">Находит новые версии</text><text x="624" y="410" font-size="15" fill="#34444E">Сравнивает изменения</text></g>
<g class="node"><rect x="1100" y="300" width="365" height="160" rx="15" fill="#E3F4FA" stroke="#AED4E1" stroke-width="2"/><rect x="1102" y="320" width="6" height="120" rx="3" fill="#67D6EF"/><text x="1124" y="343" font-size="18" font-weight="700" fill="#1A1C1D">ПРОЕКТ ОБНОВЛЕНИЯ</text><text x="1124" y="385" font-size="15" fill="#34444E">Редакция, источник, срок</text><text x="1124" y="410" font-size="15" fill="#34444E">Применимость и версии</text></g>
