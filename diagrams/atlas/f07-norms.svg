<text x="119" y="89" font-weight="700" font-size="35" fill="#1A1C1D">F07  /  КАК ОБНОВЛЯЮТСЯ НПА И НТД</text>
<text x="119" y="129" font-size="19" fill="#69777D">ИИ ищет изменения · новая редакция становится рабочей только после проверки</text>
