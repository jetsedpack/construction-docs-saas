<g class="node"><rect x="1600" y="730" width="365" height="160" rx="15" fill="#E4F5E8" stroke="#A8D2B0" stroke-width="2"/><path d="M 1602 757 Q 1782.5 777 1963 757" fill="none" stroke="#A8D2B0" stroke-width="1.8" opacity=".6"/><rect x="1602" y="750" width="6" height="120" rx="3" fill="#87E481"/><text x="1624" y="773" font-size="18" font-weight="700" fill="#1A1C1D">ИСТОРИЯ РЕДАКЦИЙ</text><text x="1624" y="815" font-size="15" fill="#34444E">Версии внутри «коробки»</text><text x="1624" y="840" font-size="15" fill="#34444E">Старые нормы не удаляем</text></g>
<g class="node"><rect x="1100" y="730" width="365" height="160" rx="15" fill="#E3F4FA" stroke="#AED4E1" stroke-width="2"/><rect x="1102" y="750" width="6" height="120" rx="3" fill="#67D6EF"/><text x="1124" y="773" font-size="18" font-weight="700" fill="#1A1C1D">ЗАТРОНУТЫЕ ДОКУМЕНТЫ</text><text x="1124" y="815" font-size="15" fill="#34444E">Определяем зависимости</text><text x="1124" y="840" font-size="15" fill="#34444E">Повторяем нужные проверки</text></g>
<g class="node"><rect x="600" y="730" width="365" height="160" rx="15" fill="#E4F5E8" stroke="#A8D2B0" stroke-width="2"/><rect x="602" y="750" width="6" height="120" rx="3" fill="#87E481"/><text x="624" y="773" font-size="18" font-weight="700" fill="#1A1C1D">ПРАВИЛА И ШАБЛОНЫ</text><text x="624" y="815" font-size="15" fill="#34444E">Валидаторы и формы</text><text x="624" y="840" font-size="15" fill="#34444E">Применимые редакции</text></g>
<g class="node"><rect x="100" y="730" width="365" height="160" rx="15" fill="#E4F5E8" stroke="#A8D2B0" stroke-width="2"/><rect x="102" y="750" width="6" height="120" rx="3" fill="#87E481"/><text x="124" y="773" font-size="18" font-weight="700" fill="#1A1C1D">СТАТУС ОБНОВЛЕНИЯ</text><text x="124" y="815" font-size="15" fill="#34444E">Дата успешной проверки</text><text x="124" y="840" font-size="15" fill="#34444E">Сбой не равен актуальности</text></g>
