[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-docs-poc"
version = "0.1.0"
description = "Windows-only construction executive documentation proof of concept with privacy-first GPUGO inference gateway"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<50",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<8",
  "python-docx>=1.1,<2",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.9,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
construction-docs = "construction_docs.cli:main"
construction-docs-ui = "construction_docs.desktop:main"

[tool.setuptools.packages.find]
include = ["construction_docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
